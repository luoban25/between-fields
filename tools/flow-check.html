<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persistent GPU wake acceptance check</title>
<style>body{font:14px/1.6 system-ui,sans-serif;margin:24px;color:#18222c;background:#f8fafb}canvas{width:160px;height:160px;background:#e8edf1}pre{white-space:pre-wrap;max-width:1000px}#result[data-status=passed]{color:#165c35}#result[data-status=failed]{color:#a52222}</style>
<h1>Persistent GPU wake acceptance check</h1>
<p>This check reads back the real density and velocity feedback textures. It advances the simulation without final scene rendering.</p>
<canvas id="gpu" width="160" height="160"></canvas>
<pre id="result" data-status="running">Initializing WebGL2…</pre>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {makeCloudVolume} from './works/wilderness/cloud-volume.js';
import {sampleFlight} from './flight-motion.js';
import {FLOW_GRID} from './works/wilderness/wake-simulation.js';

const result=document.querySelector('#result');
const report={status:'running',grid:FLOW_GRID,checkpoints:{},checks:[],shaderErrors:[]};
const started=performance.now();
let renderer,cloud;
function show(phase){report.phase=phase;report.wallSeconds=Number(((performance.now()-started)/1000).toFixed(2));result.textContent=JSON.stringify(report,null,2);}
function check(name,condition,details){report.checks.push({name,passed:Boolean(condition),details});if(!condition)throw new Error(name+': '+JSON.stringify(details));}
function probe(name){const value=cloud.simulation.inspect(renderer);report.checkpoints[name]={time:cloud.state.time,...value};return value;}
function advance(time,inside){
  cloud.update(time);
  const flight=inside?sampleFlight(time):{x:400,y:400+941*.11,yaw:0};
  cloud.updateAircraft(flight.x,flight.y-941*.11,flight.yaw,1);
  cloud.advance(renderer);
}
async function runRange(firstTick,lastTick,inside,label){
  for(let tick=firstTick;tick<=lastTick;tick++){
    advance(tick*FLOW_GRID.step,inside);
    if(tick%9===0){show(label+' · '+(tick*FLOW_GRID.step).toFixed(2)+' s');await new Promise(requestAnimationFrame);}
  }
}
try{
  renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#gpu'),antialias:false,powerPreference:'high-performance'});
  renderer.setSize(160,160,false);renderer.setPixelRatio(1);
  renderer.debug.onShaderError=(gl,program,vertex,fragment)=>{report.shaderErrors.push({program:gl.getProgramInfoLog(program),vertex:gl.getShaderInfoLog(vertex),fragment:gl.getShaderInfoLog(fragment)});};
  report.webgl2=renderer.capabilities.isWebGL2;
  cloud=makeCloudVolume(THREE,{cloudMap:null});
  advance(0,false);
  const baseline=probe('baseline');
  check('Fresh field has no injected activity',baseline.maxActivity===0&&baseline.activeCells===0,baseline);
  check('Fresh density equals original density',baseline.maxDensityDelta===0,baseline);

  const tick8=Math.round(8/FLOW_GRID.step),tick11=Math.round(11/FLOW_GRID.step),tick18=Math.round(18/FLOW_GRID.step);
  await runRange(1,tick8,true,'Aircraft crossing');
  const crossing=probe('crossing8');
  check('Crossing changes actual GPU density',crossing.maxDensityDelta>.03&&crossing.changedCells>8,crossing);
  check('Crossing injects velocity and activity',crossing.maxSpeed>1&&crossing.maxActivity>.05&&crossing.activeCells>8,crossing);

  // Advancing with exactly the same clock must leave all feedback texels still.
  advance(8,true);const pauseA=probe('pauseA');
  advance(8,true);const pauseB=probe('pauseB');
  check('Paused update preserves simulation steps',pauseA.steps===pauseB.steps&&pauseA.steps===crossing.steps,{crossing:crossing.steps,a:pauseA.steps,b:pauseB.steps});
  check('Paused update preserves readback',JSON.stringify(pauseA)===JSON.stringify(pauseB),{a:pauseA,b:pauseB});

  // The plane is now outside the entire cloud-local domain. There is no new
  // wake injection; the old GPU field must continue moving on its own.
  await runRange(tick8+1,tick11,false,'Aircraft absent; old wake evolving');
  const retained=probe('retained11');
  check('GPU field advances after aircraft leaves',retained.steps>pauseB.steps,retained);
  check('Density deformation persists three seconds without aircraft',retained.maxDensityDelta>.025&&retained.changedCells>8,retained);
  check('Rotating air persists three seconds without aircraft',retained.maxSpeed>1&&retained.maxActivity>.025&&retained.activeCells>8,retained);
  check('Persistence is not a reset',retained.resets===baseline.resets,retained);

  await runRange(tick11+1,tick18,false,'Wake dissipating without injection');
  const recovered=probe('recovered18');
  check('Old wake activity loses strength',recovered.maxActivity<retained.maxActivity,{retained:retained.maxActivity,recovered:recovered.maxActivity});
  check('Old air speed loses strength',recovered.maxSpeed<retained.maxSpeed,{retained:retained.maxSpeed,recovered:recovered.maxSpeed});
  check('No unexpected reset during recovery',recovered.resets===baseline.resets,recovered);

  cloud.reset();advance(18,false);const reset=probe('reset');
  check('Explicit reset clears activity',reset.maxActivity===0&&reset.activeCells===0,reset);
  check('Explicit reset restores untouched density',reset.maxDensityDelta===0&&reset.changedCells===0,reset);
  check('Explicit reset increments reset counter',reset.resets===baseline.resets+1,reset);
  check('Shaders compile without errors',report.shaderErrors.length===0,report.shaderErrors);
  report.status='passed';result.dataset.status='passed';show('All GPU acceptance checks passed');
}catch(error){report.status='failed';report.error={message:error.message,stack:error.stack};result.dataset.status='failed';show('GPU acceptance check failed');console.error(error);}
finally{cloud?.dispose();renderer?.dispose();}
</script>
</html>
