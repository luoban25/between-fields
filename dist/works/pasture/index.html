 <meta name="theme-color" content="#ffffff">
 <meta name="description" content="河流蜿蜒，牧群散落。飞机掠过草野，流动的白云将柔和阴影投向大地。">
 <title>风过草野 · 低空漫游</title>
 <link rel="icon" href="data:,">

<body>
 <main>
  <figure class="scene-figure">
   <div id="stage" aria-label="风过草野，河流与牧群的低空漫游" aria-busy="true">
    <canvas id="scene" role="img" tabindex="0" aria-label="不规则波浪噪点方框内，草地、河流与牧群按原比例纵向掠过。一个小比例骑车人沿土路骑行并踩踏。飞机上下左右随机游移，所有牛羊独立活动。六朵白云带着细颗粒边缘平稳漂移，其中一朵大云从飞机下方经过，飞机的影子会投到云面上，云也向地面投影。聚焦后按空格暂停或继续。"></canvas>
   </div>
   <figcaption>
    <h1>风过草野</h1>
    <p>河流蜿蜒，牧群散落。<br>沿着风的方向，缓缓经过春天。</p>
    <span>草野与河流 · 低空漫游</span>
   </figcaption>
  </figure>
  <p id="status" role="alert"></p>
 </main>
